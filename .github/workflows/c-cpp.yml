name: Windows renderer

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gradient_direction:
        description: Run the focused gradient slide direction pixel fixture
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
            machine: '14C'
          - arch: x64
            platform: x64
            machine: '8664'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build, inspect and smoke-test the renderer
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1
          msbuild VSFilterMod.sln /m /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=%WindowsSDKVersion:~0,-1% "/p:Configuration=Release (MOD)" /p:Platform=${{ matrix.platform }} || exit /b 1
          set "dll=bin\${{ matrix.platform }}\VSFilter\Release (MOD)\VSFilterModOborodzuki.dll"
          if not exist "%dll%" exit /b 1
          dumpbin /headers "%dll%" > pe-headers.txt || exit /b 1
          findstr /r /c:"^[ ]*${{ matrix.machine }} machine (" pe-headers.txt || exit /b 1
          dumpbin /exports /dependents "%dll%" || exit /b 1
          cl /nologo /W4 /EHsc /O2 /MT .github\ci\csri-smoke.cpp /Fe:csri-smoke.exe || exit /b 1
          csri-smoke.exe "%CD%\%dll%" || exit /b 1
          mkdir dist || exit /b 1
          copy "%dll%" dist\ || exit /b 1
          copy LICENSE dist\ || exit /b 1
          copy README.md dist\ || exit /b 1

      - name: Run focused CSRI gradient direction pixels
        if: inputs.gradient_direction && matrix.arch == 'x64'
        run: python .github/parallel/gradient-slide-direction.py dist/VSFilterModOborodzuki.dll

      - uses: actions/upload-artifact@v4
        with:
          name: VSFilterMod-Oborodzuki-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
